# Airchive production reverse proxy.
#
# Terminates TLS, fronts the Next.js dashboard and the gateway REST API, and
# carries the live-telemetry WebSocket. Mounted read-only at
# /etc/nginx/nginx.conf, so it must be a complete top-level config (not a
# conf.d snippet).
#
# ---------------------------------------------------------------------------
# TLS material — mount into /etc/nginx/certs/ (read-only). Expected filenames:
#
#   /etc/nginx/certs/fullchain.pem   leaf certificate + intermediate chain
#   /etc/nginx/certs/privkey.pem     matching private key (PEM, unencrypted)
#   /etc/nginx/certs/chain.pem       intermediate chain only, for OCSP
#                                    stapling verification (optional; only
#                                    needed if you enable ssl_stapling below)
#
# These are exactly the filenames Certbot writes into
# /etc/letsencrypt/live/<domain>/, so the host side can bind-mount that
# directory straight through. nginx must be reloaded after every renewal
# (`docker compose exec nginx nginx -s reload`) — it reads certificates once
# at startup.
# ---------------------------------------------------------------------------

worker_processes auto;
worker_rlimit_nofile 65535;

error_log /dev/stderr warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept       on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Log to the container's stdout/stderr so Docker's json-file driver owns
    # rotation (see the `logging` block for this service in docker-compose.yml).
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'rt=$request_time urt=$upstream_response_time';
    access_log  /dev/stdout main;

    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    server_tokens      off;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # Telemetry API payloads are small; cap bodies well below anything that
    # could be used to exhaust worker memory.
    client_max_body_size    2m;
    client_body_timeout     15s;
    client_header_timeout   15s;
    large_client_header_buffers 4 16k;

    # --- Rate limiting -----------------------------------------------------
    # Keyed on the client address. If this proxy ever sits behind another
    # L7 device, add the relevant `set_real_ip_from`/`real_ip_header` lines
    # below or every request will be attributed to that device's address.
    limit_req_zone  $binary_remote_addr zone=api:10m   rate=30r/s;
    limit_req_zone  $binary_remote_addr zone=ws:10m    rate=10r/s;
    limit_req_zone  $binary_remote_addr zone=app:10m   rate=60r/s;
    limit_conn_zone $binary_remote_addr zone=perip:10m;
    limit_req_status  429;
    limit_conn_status 429;

    # real_ip_header    X-Forwarded-For;
    # set_real_ip_from  10.0.0.0/8;
    # real_ip_recursive on;

    # --- Compression -------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_min_length   256;
    gzip_types        text/plain text/css text/xml application/json
                      application/javascript application/x-javascript
                      text/javascript application/xml application/xml+rss
                      image/svg+xml application/manifest+json;

    # --- TLS ---------------------------------------------------------------
    ssl_protocols             TLSv1.2 TLSv1.3;
    # ECDHE-only suites: forward secrecy without needing an ssl_dhparam file.
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_ecdh_curve            X25519:prime256v1:secp384r1;
    ssl_session_cache         shared:TLS:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # OCSP stapling needs chain.pem present and a working resolver; nginx
    # refuses to start if ssl_trusted_certificate points at a missing file,
    # so it stays off until the operator supplies the chain.
    # ssl_stapling            on;
    # ssl_stapling_verify     on;
    # ssl_trusted_certificate /etc/nginx/certs/chain.pem;

    # Docker's embedded DNS. Required because the proxy targets below are
    # written as variables: that defers name resolution to request time, so a
    # recreated gateway/dashboard container picking up a new IP does not leave
    # nginx serving 502s against a stale address cached at startup.
    resolver       127.0.0.11 ipv6=off valid=10s;
    resolver_timeout 5s;

    # An absent Upgrade header must become `close`, not `upgrade`.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    # Both servers below listen on IPv4 only. Docker forwards the host's IPv6
    # traffic to the container over IPv4, whereas a `listen [::]:...` line makes
    # nginx fail to start outright on hosts where IPv6 is disabled in the
    # kernel. Add IPv6 listeners once the container network carries IPv6.

    # ---------------------------------------------------------------- :80 ---
    # Plain HTTP exists only for the ACME challenge, the container health
    # probe, and to push everything else to TLS. The redirect lives inside
    # `location /` rather than the server block, because a server-level
    # `return` runs in the rewrite phase and would swallow /healthz too.
    server {
        listen      80;
        server_name _;

        location = /healthz {
            access_log   off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            access_log off;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # --------------------------------------------------------------- :443 ---
    server {
        listen      443 ssl;
        http2       on;

        # Replace with the deployment's FQDN so requests carrying an unknown
        # Host are not silently served by this vhost.
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        # Security headers. Note nginx's add_header inheritance rule: a single
        # add_header inside a location REPLACES this whole set for that
        # location, so nothing below adds headers per-location.
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header X-Frame-Options           "DENY" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Permissions-Policy        "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;

        # CSP scoped to what the dashboard actually needs:
        #  - 'unsafe-inline' script: the Next.js App Router streams RSC
        #    payloads through inline <script> tags and no nonce middleware is
        #    in place.
        #  - 'unsafe-eval'/'wasm-unsafe-eval'/blob:: CesiumJS compiles shaders,
        #    spawns its workers from blob URLs, and loads WASM decoders.
        #  - 'self' covers the live-telemetry WebSocket, since CSP treats
        #    wss:// on the same origin as same-origin.
        # Cesium Ion resolves world imagery through its asset API and may hand
        # back tiles from a different CDN than the hosts listed here; if the
        # globe renders blank, check the browser console for a CSP violation
        # and add that tile host to img-src/connect-src.
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' blob:; worker-src 'self' blob:; child-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https://api.cesium.com https://assets.ion.cesium.com https://ibasemaps-api.arcgis.com https://*.virtualearth.net https://*.bing.com; connect-src 'self' https://api.cesium.com https://assets.ion.cesium.com https://ibasemaps-api.arcgis.com https://*.virtualearth.net" always;

        # Proxy targets as variables (see the `resolver` note above). With a
        # variable, nginx does not append the matched location prefix, so the
        # original request line is forwarded verbatim via $request_uri —
        # which also avoids a second round of URI decoding.
        set $gateway_api  http://gateway:4000;
        set $gateway_ws   http://gateway:4001;
        set $dashboard_up http://dashboard:3000;

        # No add_header here: one would drop the whole security-header set for
        # this location (see the inheritance note above).
        location = /healthz {
            access_log   off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Live telemetry WebSocket. The gateway runs its ws server on a
        # separate listener (GATEWAY_WS_PORT, default 4001) and binds it to
        # the exact path /ws — see services/gateway/src/ws-hub.ts
        # (`new WebSocketServer({ server, path: "/ws" })`).
        location = /ws {
            limit_req  zone=ws burst=10 nodelay;
            limit_conn perip 24;

            proxy_pass $gateway_ws$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Telemetry can be quiet between position reports and the hub only
            # pings every 30s, so anything short of a very long read timeout
            # drops live sessions. Buffering must stay off for a stream.
            proxy_read_timeout  86400s;
            proxy_send_timeout  86400s;
            proxy_buffering     off;
            proxy_cache         off;
        }

        location /api/ {
            limit_req  zone=api burst=60 nodelay;
            limit_conn perip 64;

            proxy_pass $gateway_api$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_read_timeout    60s;
            proxy_send_timeout    60s;
        }

        location / {
            limit_req  zone=app burst=120 nodelay;

            proxy_pass $dashboard_up$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_read_timeout    60s;
            proxy_send_timeout    60s;
        }
    }
}
