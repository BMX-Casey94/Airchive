<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#0B1626"/>
      <stop offset="100%" stop-color="#04070F"/>
    </radialGradient>
    <linearGradient id="trail" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFB800" stop-opacity="0"/>
      <stop offset="100%" stop-color="#FFC94D"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- azimuthal equidistant disc graticule -->
  <circle cx="32" cy="32" r="24" stroke="#00F5FF" stroke-opacity="0.55" stroke-width="2"/>
  <circle cx="32" cy="32" r="16.5" stroke="#00F5FF" stroke-opacity="0.28" stroke-width="1.4"/>
  <circle cx="32" cy="32" r="9" stroke="#00F5FF" stroke-opacity="0.18" stroke-width="1.2"/>
  <circle cx="32" cy="32" r="1.8" fill="#00F5FF" opacity="0.9"/>
  <!-- amber flight trail sweeping into the aircraft -->
  <path d="M14 46 Q 24 44 33 35" stroke="url(#trail)" stroke-width="2.6" stroke-linecap="round"/>
  <!-- aircraft, heading north-east -->
  <g transform="translate(38,26) rotate(45)">
    <path d="M0 -9 C 1.1 -7.8 1.3 -5.4 1.3 -3.4 L 9.5 1.6 L 9.5 4 L 1.3 1.6 C 1.2 3.8 1 5.4 0.7 6.6 L 3.4 8.6 L 3.4 10.4 L 0 9.4 L -3.4 10.4 L -3.4 8.6 L -0.7 6.6 C -1 5.4 -1.2 3.8 -1.3 1.6 L -9.5 4 L -9.5 1.6 L -1.3 -3.4 C -1.3 -5.4 -1.1 -7.8 0 -9 Z" fill="#EAF8FF"/>
  </g>
</svg>
